model_list:
  # 地端模型（K8s vLLM 服務）
  #
  # 2026-07-28：31b/26b 改走 k8s/internal-lb/（專用內部 Traefik，p2c 策略）做
  # least-request 分流，取代之前短暫用過的「StatefulSet + LiteLLM least-busy router」
  # 方案——那個方案驗證有效，但代價是 api_base 筆數要跟 maxReplicaCount 手動同步，
  # 容易忘記漏加。現在改成單筆 api_base 指向 internal-lb，Traefik 自己 watch
  # K8s Service 的 Endpoints、replica 增減完全自動跟上，不用碰這裡的設定。
  - model_name: gemma-4-31B-it
    litellm_params:
      model: hosted_vllm/google/gemma-4-31B-it
      api_base: http://internal-lb.ai-platform.svc.cluster.local:8000/lb/gemma-4-31b/v1
      api_key: EMPTY

  - model_name: gemma-4-26B-A4B-it
    litellm_params:
      model: hosted_vllm/google/gemma-4-26B-A4B-it
      api_base: http://internal-lb.ai-platform.svc.cluster.local:8000/lb/gemma-4-26b/v1
      api_key: EMPTY

  - model_name: embeddinggemma-300m
    litellm_params:
      model: hosted_vllm/google/embeddinggemma-300m
      api_base: http://light-models-vllm-service:8000/v1
      api_key: EMPTY

  # marker-service：跑在 light-models 同一個 pod（同一張 GPU），見 k8s/vllm/light-models/。
  # 轉檔可能長達 30 分鐘，per-model timeout 蓋掉全域 request_timeout（600s），
  # num_retries=0 蓋掉全域重試設定，避免對已經逾時的長任務重打一次。
  - model_name: marker/pdf-to-md
    litellm_params:
      model: openai/marker-pdf-to-md
      api_base: http://light-models-vllm-service:8766/v1
      api_key: "none"
      timeout: 1860
      num_retries: 0

  # 臨時地端（Ollama，應急短期需求）
  - model_name: ollama/*
    litellm_params:
      model: ollama/*
      api_base: http://ollama-service:11434

  # 雲端（OpenRouter）— 開發期先放一個代表模型，需要時再加
  # api_key 由 custom_logger.py 的 pre_call_hook 動態注入（從部門設定讀取）
  - model_name: openrouter/openai/gpt-4o-mini
    litellm_params:
      model: openai/openai/gpt-4o-mini
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY_PLACEHOLDER

litellm_settings:
  callbacks: ["custom_logger.proxy_handler_config", "langfuse"]
  drop_params: true
  request_timeout: 600
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  custom_auth: /app/config/custom_auth.user_api_key_auth
  custom_auth_run_common_checks: false
