model_list:
  # 地端模型（K8s vLLM 服務）
  - model_name: reasoning-qwen
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3.6-27B
      api_base: http://reasoning-vllm-service:8000/v1
      api_key: EMPTY

  - model_name: fast-qwen
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3.6-35B-A3B-FP8
      api_base: http://fast-vllm-service:8000/v1
      api_key: EMPTY

  - model_name: embed-qwen
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3-Embedding-8B
      api_base: http://embed-vllm-service:8000/v1
      api_key: EMPTY

  - model_name: rerank-qwen
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3-Reranker-8B
      api_base: http://rerank-vllm-service:8001
      api_key: EMPTY

  # 臨時地端（Ollama，應急短期需求）
  - model_name: ollama/*
    litellm_params:
      model: ollama/*
      api_base: http://ollama-service:11434

  # 雲端（OpenRouter）— 開發期先放一個代表模型，需要時再加
  # api_key 由 custom_logger.py 的 pre_call_hook 動態注入（從部門設定讀取）
  - model_name: openrouter/openai/gpt-4o-mini
    litellm_params:
      model: openai/openai/gpt-4o-mini
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY_PLACEHOLDER

litellm_settings:
  callbacks: ["custom_logger.proxy_handler_config"]
  drop_params: true
  request_timeout: 600
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  custom_auth: /app/config/custom_auth.user_api_key_auth
  custom_auth_run_common_checks: false
