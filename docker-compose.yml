services:
  vllm-qwen:
    image: "vllm/vllm-openai:latest"
    container_name: firdi-vllm-qwen
    command:
      - --model
      - Qwen/Qwen3.5-9B
      - --served-model-name
      - Qwen/Qwen3.5-9B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "${QWEN_TENSOR_PARALLEL_SIZE:-1}"
      - --gpu-memory-utilization
      - "${QWEN_GPU_MEMORY_UTILIZATION:-0.65}"
      - --max-model-len
      - "${QWEN_MAX_MODEL_LEN:-32768}"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
    ports:
      - "${QWEN_VLLM_PORT:-8001}:8000"
    volumes:
      - "${HF_HOME:-./.cache/huggingface}:/root/.cache/huggingface"
    shm_size: "${VLLM_SHM_SIZE:-32gb}"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    restart: unless-stopped

