# 套用前請先 source .env，再用 envsubst 展開變數（scripts/deploy.sh monitoring 已處理）：
#   source .env && envsubst < k8s/monitoring/prometheus-deployment.yaml | kubectl apply -f -
#
# 精簡版：單一 Prometheus（無 Operator/Grafana/Alertmanager），5Gi PVC + 5 天
# retention（時間、大小雙重上限，哪個先到就先觸發清理）——這台開發機磁碟已 91%
# 滿，刻意設保守值。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: ai-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${K8S_PVC_STORAGE_CLASS}
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ai-platform
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=5d
            - --storage.tsdb.retention.size=4GB
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules/disk-alerts.yml
              subPath: disk-alerts.yml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
        - name: rules
          configMap:
            name: prometheus-config
            items:
              - key: disk-alerts.yml
                path: disk-alerts.yml
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ai-platform
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
