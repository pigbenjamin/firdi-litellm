apiVersion: apps/v1
kind: Deployment
metadata:
  name: light-models-vllm
  namespace: ai-platform
  labels:
    app: light-models-vllm
spec:
  replicas: 1
  # 單副本 GPU 工作負載：先殺舊 pod 釋放 GPU 再起新 pod，避免 RollingUpdate 死鎖
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: light-models-vllm
  template:
    metadata:
      labels:
        app: light-models-vllm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      runtimeClassName: nvidia
      # 節點選擇依 .env 的 K8S_MARKER_INGEST_STORAGE 而定，deploy.sh 的
      # resolve_node_pinning_vars() 會算好填入下面兩個變數，這裡不用手動改：
      #   hostpath（預設）── marker-ingest-pvc 的 PV 用 nodeAffinity 硬釘同一
      #                       hostname（hostPath 儲存限制），這裡必須用同一個
      #                       hostname 硬釘，否則 pod 排到別的節點會掛不上那顆 PV。
      #   cephfs            ── marker-ingest 換成 RWX 網路儲存後不用再釘節點，跟
      #                       31b/26b 一樣走 gpu-pool=shared 浮動池，靠
      #                       PriorityClass 搶佔（見 k8s/priorityclasses.yaml）。
      nodeSelector:
        ${LIGHT_MODELS_NODE_SELECTOR_KEY}: ${LIGHT_MODELS_NODE_SELECTOR_VALUE}
      # 浮動池最低優先權（先設定好，等未來真正浮動時直接生效；目前 hostname 硬釘下，若同節點
      # 上 31b/26b 需要搶佔資源，仍會依此優先權驅逐 light-models）
      priorityClassName: gpu-priority-low
      containers:
        # 單一 container 同時跑 embed-vllm（port 8000）與 marker-service（port 8766），
        # 共用同一份 nvidia.com/gpu: 1 配額 — 這個叢集的 device plugin 是整張 GPU
        # 配一顆 container，兩個各自 request GPU 的 pod 會落在兩張不同實體卡上，
        # 無法共用。啟動順序與 wait -n 見 marker-service/entrypoint.sh。
        - name: vllm
          image: ${LIGHT_MODELS_IMAGE}
          imagePullPolicy: ${LIGHT_MODELS_IMAGE_PULL_POLICY}
          ports:
            - containerPort: 8000
              name: embed
            - containerPort: 8766
              name: marker
          env:
            - name: EMBED_MODEL
              value: google/embeddinggemma-300m
            # 300M 小模型，0.15（~14GB）已綽綽有餘；卡上其餘容量留給 marker 與未來擴充
            - name: EMBED_GPU_MEM_UTIL
              value: "0.15"
            - name: EMBED_MAX_NUM_SEQS
              value: "512"
            - name: EMBED_PORT
              value: "8000"
            - name: MARKER_PORT
              value: "8766"
            # marker 單一 worker 處理一份 PDF 的逾時上限；watchdog 會在這之後
            # 再等一段 grace 才強制重啟整個 pod（見 marker_worker.py）
            - name: MARKER_TIMEOUT
              value: "1800"
            # 與下方 ingest-data 掛載點一致；請求的 pdf_path/out_dir 必須落在此目錄下
            - name: MARKER_ALLOWED_BASE_DIR
              value: /data
            - name: NCCL_P2P_DISABLE
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: HF_HOME
              value: /cache/huggingface
            # torch.compile 快取持久化到 hostPath，重啟免全額重編（vLLM 依模型+設定雜湊分目錄，可多模型共用）
            - name: VLLM_CACHE_ROOT
              value: /cache/huggingface/vllm-compile-cache
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/huggingface
            - name: shm
              mountPath: /dev/shm
            # docblock-rag-platform 的 ingest-worker 寫入的 PDF / 讀取的 md 輸出，
            # 與 docblock namespace 的 docblock-ingest-pvc 指向同一個 hostPath
            - name: ingest-data
              mountPath: /data
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "curl -sf http://localhost:8000/health && curl -sf http://localhost:8766/healthz"
            initialDelaySeconds: 30
            periodSeconds: 15
            # embed 啟動快，但 marker 首次要載入/下載 surya 系列模型，給足夠預算
            failureThreshold: 40
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "curl -sf http://localhost:8000/health && curl -sf http://localhost:8766/healthz"
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "curl -sf http://localhost:8000/health && curl -sf http://localhost:8766/healthz"
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: hf-cache
          hostPath:
            path: ${K8S_HF_CACHE_HOST_PATH}
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: ingest-data
          persistentVolumeClaim:
            claimName: marker-ingest-pvc
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        # 部分叢集會給 GPU 節點額外加 node-pool=compute:NoSchedule taint（防一般 workload
        # 排進來）；沒有這個 taint 的叢集加這條 toleration 是 no-op，不影響排程。
        - key: node-pool
          operator: Equal
          value: compute
          effect: NoSchedule
