apiVersion: apps/v1
kind: Deployment
metadata:
  name: embed-rerank-vllm
  namespace: ai-platform
  labels:
    app: embed-rerank-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embed-rerank-vllm
  template:
    metadata:
      labels:
        app: embed-rerank-vllm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.9.2
          imagePullPolicy: IfNotPresent
          # 啟動腳本：先啟 embed（port 8000），確認 /health 後再啟 rerank（port 8001）。
          # 兩個進程共用同一張 GPU（nvidia.com/gpu: 1），各自限制 gpu-memory-utilization=0.45。
          # 若任一進程退出，wait -n 使容器也退出，K8s 將自動重啟。
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              python3 -m vllm.entrypoints.openai.api_server \
                --model=Qwen/Qwen3-Embedding-8B \
                --task=embed \
                --gpu-memory-utilization=0.45 \
                --max-num-seqs=512 \
                --served-model-name=Qwen/Qwen3-Embedding-8B \
                --host=0.0.0.0 \
                --port=8000 \
                --trust-remote-code \
                --disable-custom-all-reduce &
              EMBED_PID=$!

              echo "Waiting for embed vLLM on port 8000..."
              for i in $(seq 1 120); do
                if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
                  echo "Embed vLLM ready after $((i * 5))s."
                  break
                fi
                sleep 5
              done

              python3 -m vllm.entrypoints.openai.api_server \
                --model=Qwen/Qwen3-Reranker-8B \
                --task=score \
                --gpu-memory-utilization=0.45 \
                --max-num-seqs=256 \
                --served-model-name=Qwen/Qwen3-Reranker-8B \
                --host=0.0.0.0 \
                --port=8001 \
                --trust-remote-code \
                --disable-custom-all-reduce &
              RERANK_PID=$!

              wait -n $EMBED_PID $RERANK_PID
          ports:
            - containerPort: 8000
              name: embed
            - containerPort: 8001
              name: rerank
          env:
            - name: VLLM_USE_V1
              value: "0"
            - name: NCCL_P2P_DISABLE
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: HF_HOME
              value: /cache/huggingface
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/huggingface
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "curl -sf http://localhost:8000/health && curl -sf http://localhost:8001/health"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "curl -sf http://localhost:8000/health && curl -sf http://localhost:8001/health"
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "curl -sf http://localhost:8000/health && curl -sf http://localhost:8001/health"
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: hf-cache
          hostPath:
            path: ${K8S_HF_CACHE_HOST_PATH}
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
