apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-4-31b-vllm
  namespace: ai-platform
  labels:
    app: gemma-4-31b-vllm
spec:
  replicas: 1
  # 單副本 GPU 工作負載：先殺舊 pod 釋放 GPU 再起新 pod，避免 RollingUpdate 死鎖
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gemma-4-31b-vllm
  template:
    metadata:
      labels:
        app: gemma-4-31b-vllm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      runtimeClassName: nvidia
      # 多節點叢集：釘選到有 GPU 的節點（同時也是 hf-cache hostPath 所在節點）
      nodeSelector:
        kubernetes.io/hostname: ${K8S_GPU_NODE_HOSTNAME}
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.23.0
          imagePullPolicy: IfNotPresent
          args:
            - "--model=google/gemma-4-31B-it"
            - "--tensor-parallel-size=2"
            - "--max-model-len=65536"
            - "--gpu-memory-utilization=0.85"
            - "--max-num-seqs=2"
            - "--max-num-batched-tokens=8192"
            - "--reasoning-parser=gemma4"
            - "--tool-call-parser=gemma4"
            - "--enable-auto-tool-choice"
            # 思考型:預設開啟 thinking(<|think|>),client 可用 chat_template_kwargs 覆寫
            - '--default-chat-template-kwargs={"enable_thinking": true}'
            - "--served-model-name=google/gemma-4-31B-it"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--trust-remote-code"
            - "--disable-custom-all-reduce"
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NCCL_P2P_DISABLE
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: HF_HOME
              value: /cache/huggingface
            # torch.compile 快取持久化到 hostPath，重啟免全額重編（vLLM 依模型+設定雜湊分目錄，可多模型共用）
            - name: VLLM_CACHE_ROOT
              value: /cache/huggingface/vllm-compile-cache
          resources:
            limits:
              nvidia.com/gpu: "2"
            requests:
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/huggingface
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            # Gemma4 冷啟動（權重載入 + torch.compile + CUDA graph）實測可超過 11 分鐘
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: hf-cache
          hostPath:
            path: ${K8S_HF_CACHE_HOST_PATH}
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        # 部分叢集會給 GPU 節點額外加 node-pool=compute:NoSchedule taint（防一般 workload
        # 排進來）；沒有這個 taint 的叢集加這條 toleration 是 no-op，不影響排程。
        - key: node-pool
          operator: Equal
          value: compute
          effect: NoSchedule
