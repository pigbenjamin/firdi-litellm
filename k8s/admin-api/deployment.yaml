apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: ai-platform
  labels:
    app: admin-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
    spec:
      # users-db-pvc 是 ReadWriteOnce，litellm 也掛同一顆——RWO 同一時間只能掛在一個
      # 節點，用 podAffinity 把這個 Pod 釘住 litellm Pod 所在節點，兩者才能同時掛上。
      # litellm 在 deploy_all 裡先部署，這裡才會有現成的 litellm Pod 可以 affine。
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: litellm
              topologyKey: kubernetes.io/hostname
      containers:
        - name: admin-api
          image: ${ADMIN_API_IMAGE}
          imagePullPolicy: ${ADMIN_API_IMAGE_PULL_POLICY}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: admin-api-secrets
                  key: api-key
            - name: USER_AUTH_DB_PATH
              value: /app/data/users.db
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-api-secrets
                  key: webhook-secret
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: admin-api-secrets
                  key: keycloak-url
            - name: KEYCLOAK_REALM
              valueFrom:
                secretKeyRef:
                  name: admin-api-secrets
                  key: keycloak-realm
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: admin-api-secrets
                  key: keycloak-client-id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-api-secrets
                  key: keycloak-client-secret
            - name: KEYCLOAK_SSL_VERIFY
              valueFrom:
                secretKeyRef:
                  name: admin-api-secrets
                  key: keycloak-ssl-verify
            # 自助端點網頁登入用（見 admin-api/routers/me_web.py），跟上面
            # KEYCLOAK_CLIENT_ID/SECRET（webhook 專用）是不同的 Keycloak client。
            - name: KEYCLOAK_SELFSERVICE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: admin-api-secrets
                  key: keycloak-selfservice-client-id
                  optional: true
            - name: KEYCLOAK_SELFSERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-api-secrets
                  key: keycloak-selfservice-client-secret
                  optional: true
            # 使用者瀏覽器看得到的 admin-api 網址（反向代理位址或
            # http://<node-ip>:30408），Keycloak 登入完導回這裡；跟叢集內部 DNS
            # 是兩回事，未設定時 /api/v1/me/web/login 會回 500 並說明原因。
            - name: ADMIN_API_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: admin-api-secrets
                  key: admin-api-public-url
                  optional: true
            # Keycloak 瀏覽器看到的官方 hostname，只在跟 KEYCLOAK_URL 不同時才需要
            # 設定（見 admin-api/keycloak.py 的 KEYCLOAK_BROWSER_URL 註解）
            - name: KEYCLOAK_BROWSER_URL
              valueFrom:
                secretKeyRef:
                  name: admin-api-secrets
                  key: keycloak-browser-url
                  optional: true
            - name: LITELLM_URL
              value: "http://litellm-service:4000"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            - name: OPENWEBUI_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: openwebui-url
            - name: OPENWEBUI_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: openwebui-admin-key
            # 第二組 OpenWebUI 入口（push target=b 用；optional：未設定時 push 會安全 no-op）
            - name: OPENWEBUI_URL_B
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: openwebui-url-b
                  optional: true
            - name: OPENWEBUI_ADMIN_KEY_B
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: openwebui-admin-key-b
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: users-db
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: users-db
          persistentVolumeClaim:
            claimName: users-db-pvc
