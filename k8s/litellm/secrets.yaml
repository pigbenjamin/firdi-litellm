# 此檔案為範本，實際 Secret 請手動建立或透過外部 secrets 管理工具產生
# kubectl create secret generic litellm-secrets \
#   --from-literal=master-key=sk-firdi-master-change-me \
#   -n ai-platform
#
# kubectl create secret generic hf-token \
#   --from-literal=token=<your-hf-token> \
#   -n ai-platform
#
# 不要將實際 key 提交進版控

# 以下為結構參考（不包含真實值）：
# apiVersion: v1
# kind: Secret
# metadata:
#   name: litellm-secrets
#   namespace: ai-platform
# type: Opaque
# stringData:
#   master-key: "sk-firdi-master-CHANGE-ME"
#   openwebui-url: "http://10.90.20.55:5000"
#   openwebui-admin-key: "CHANGE-ME"
#   openwebui-service-key: "firdi-openwebui-service-key"
#   # 第二組 OpenWebUI 入口 B（可選；B 上線前留空即可，deployment 皆設 optional）
#   openwebui-url-b: "CHANGE-ME"            # B 的網址
#   openwebui-admin-key-b: "CHANGE-ME"      # B 管理員帳號的 API key（與 A 不通用）
#   openwebui-service-key-b: "CHANGE-ME"    # 自己生成一把，同時填到 B 的 LiteLLM connection
#   langfuse-public-key: "CHANGE-ME"        # Langfuse 專案的 Public Key
#   langfuse-secret-key: "CHANGE-ME"        # Langfuse 專案的 Secret Key
#   langfuse-host: "http://10.90.20.55:3001"
#   database-url: "postgresql://litellm:CHANGE-ME@postgres-service:5432/litellm"  # store_model_in_db 用，見 k8s/postgres/

# kubectl create secret generic litellm-secrets \
#   --from-literal=master-key=sk-firdi-master-change-me \
#   --from-literal=openwebui-url=http://10.90.20.55:5000 \
#   --from-literal=openwebui-admin-key=<your-openwebui-admin-key> \
#   --from-literal=openwebui-service-key=firdi-openwebui-service-key \
#   -n ai-platform
#
# B（第二個 OpenWebUI 入口）上線後：在 .env 填 OPENWEBUI_URL_B /
# OPENWEBUI_ADMIN_KEY_B / OPENWEBUI_SERVICE_KEY_B，跑
# `./scripts/deploy.sh secrets` 一次重建整份 secret（deploy_secrets() 已把這三個
# key 併進同一個 kubectl apply），再 `kubectl rollout restart deploy/litellm
# deploy/admin-api -n ai-platform`。
#
# ⚠️ 不要用「只帶 -b 三個 --from-literal」的指令去 apply 既有 secret：
# kubectl apply 是拿目前 live 物件上的 last-applied-configuration 跟這次的
# 新內容做 3-way merge，只列出 B 的三個 key 會讓 master-key / openwebui-url 等
# 上次 apply 時記錄過、這次沒帶到的 key 被當成「已移除」而一併刪掉。真的要手動
# 補，--from-literal 要把既有全部 key（含 master-key 等）一起帶上，或直接用
# deploy.sh。
