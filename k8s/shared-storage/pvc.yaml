# 02-pvcs.yaml（公司叢集慣例）風格：交由 storageClassName 動態佈建
# （例如公司 Ceph 叢集的 rook-ceph-block），不再靠 hostPath + nodeAffinity 手動釘節點。
# 套用前請先 source .env，再用 envsubst 展開變數：
#   source .env && envsubst < k8s/shared-storage/pvc.yaml | kubectl apply -f -
#
# 2026-09：users-db-pvc(SQLite) 已遷到 Postgres（見 k8s/postgres/、
# admin-api/database.py），litellm/admin-api 的 deployment.yaml 都已經不再掛這顆
# PVC 了。**這裡刻意還沒刪掉這個資源定義**：要等正式環境確認資料搬移完成（跑過
# 一次性搬遷腳本、核對過 row count）之後，才能安全 `kubectl delete pvc
# users-db-pvc -n ai-platform` 並把下面這段拿掉——PVC 裡在那之前仍是唯一一份
# production 資料，不要提前刪。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: users-db-pvc
  namespace: ai-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${K8S_PVC_STORAGE_CLASS}
  resources:
    requests:
      storage: 1Gi
---
# admin-api 掛這顆存 admin-web 的稽核 jsonl（見 admin-api/audit.py），跟 litellm 的
# usage.jsonl 不同檔名、同一個目錄——admin-api 靠 podAffinity 釘在 litellm 所在
# 節點，RWO 才能同時掛上兩個 Deployment。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-logs-pvc
  namespace: ai-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${K8S_PVC_STORAGE_CLASS}
  resources:
    requests:
      storage: 5Gi
