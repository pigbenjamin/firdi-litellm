# 02-pvcs.yaml（公司叢集慣例）風格：交由 storageClassName 動態佈建
# （例如公司 Ceph 叢集的 rook-ceph-block），不再靠 hostPath + nodeAffinity 手動釘節點。
# 套用前請先 source .env，再用 envsubst 展開變數：
#   source .env && envsubst < k8s/shared-storage/pvc.yaml | kubectl apply -f -
#
# users-db-pvc 同時被 admin-api、litellm 兩個 Deployment 掛 ReadWriteOnce——RWO 同一
# 時間只能掛在一個節點，兩個 Pod 必須排到同一節點才能都掛得上。做法是在
# k8s/admin-api/deployment.yaml 用 podAffinity 把 admin-api 釘住 litellm 所在節點，
# 這裡不需要再處理。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: users-db-pvc
  namespace: ai-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${K8S_PVC_STORAGE_CLASS}
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-logs-pvc
  namespace: ai-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${K8S_PVC_STORAGE_CLASS}
  resources:
    requests:
      storage: 5Gi
